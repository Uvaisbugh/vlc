name: Native Qt redesign validation

on:
  push:
    branches: [codex/vlc-redesign]
    paths:
      - '.github/workflows/native-qt-tests.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-qt-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  native-qt-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260611225331
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_SCALE_FACTOR: '1'
    steps:
      - name: Check out native source and test suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build patched media library and native VLC
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # QML's data: SVG images require the runtime image-format plugin.
          # Keep it on the image's Qt version instead of mixing private Qt ABIs.
          test "$(pkg-config --modversion Qt6Core)" = 6.10.2
          mkdir -p build-qt-svg
          curl --fail --location --retry 3 https://snapshot.debian.org/file/307fdd8f021f88ed0a6a6b4cec33f032b552c672 -o build-qt-svg/plugins.deb
          curl --fail --location --retry 3 https://snapshot.debian.org/file/9d54571d138be2cb836195aeb436e09199bd0812 -o build-qt-svg/library.deb
          echo '6b7b6f65050cabff8c605999b6b363ea17ea5037e4df3a263e058ee45d1b7ad0  build-qt-svg/plugins.deb' | sha256sum --check
          echo '3e329fc50849664da3533219b0834f9321d70da78728079bfc56782f9088fe39  build-qt-svg/library.deb' | sha256sum --check
          dpkg-deb --extract build-qt-svg/plugins.deb build-qt-svg/runtime
          dpkg-deb --extract build-qt-svg/library.deb build-qt-svg/runtime
          export QT_PLUGIN_PATH="$PWD/build-qt-svg/runtime/usr/lib/x86_64-linux-gnu/qt6/plugins"
          export LD_LIBRARY_PATH="$PWD/build-qt-svg/runtime/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          echo "QT_PLUGIN_PATH=$QT_PLUGIN_PATH" >> "$GITHUB_ENV"
          export JOBS=4
          extras/package/release/build-medialibrary.sh
          export PKG_CONFIG_PATH="$PWD/build-release-deps/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$PWD/build-release-deps/prefix/lib:${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          meson setup build-redesign -Dqt=enabled -Dmedialibrary=enabled -Dtests=enabled -Dextra_checks=true
          meson compile -C build-redesign -j 4

      - name: Run native Qt and QML tests
        # Some test executables are build_by_default:false; let Meson build them.
        run: |
          meson introspect --tests build-redesign > build-redesign/meson-logs/test-inventory.json
          python3 - <<'PY'
          import json, pathlib
          registered = {test['name'] for test in json.loads(pathlib.Path('build-redesign/meson-logs/test-inventory.json').read_text())}
          expected = {path.stem for path in pathlib.Path('modules/gui/qt/tests').glob('tst_Redesign*.qml')}
          missing = expected - registered
          if missing:
              raise SystemExit('Redesign tests missing from native build: ' + ', '.join(sorted(missing)))
          print(f'All {len(expected)} redesign QML suites are registered.')
          PY
          # Root bypasses read-only fixtures, invalidating storage-failure tests.
          useradd --create-home vlctest
          chown -R vlctest:vlctest "$GITHUB_WORKSPACE"
          runuser -u vlctest -- meson test -C build-redesign --suite qt --print-errorlogs --timeout-multiplier 2

      - name: Preserve native test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-qt-tests-${{ github.sha }}
          path: build-redesign/meson-logs/
          if-no-files-found: warn
          retention-days: 14
